name: Catalog Refresh & Pre-scrape a Supabase

on:
  schedule:
    # Crawl COMPLETO del catálogo una vez al día (04:00 UTC). Es más pesado que el antiguo
    # refresh de home/últimos, así que se corre a diario en lugar de cada 6 h para no saturar
    # las fuentes; los listados (getAll) ya se auto-refrescan en vivo entre corridas.
    - cron: '0 4 * * *'
  # Permite ejecución manual desde la interfaz de GitHub, con cuatro mandos:
  #
  # `solo` dedica la pasada a UNA web. Existe para FuegoCine, que es la única probada que publica
  # ficheros PERMANENTES —708 de las 961 urls sin caducidad que llegó a tener el catálogo salieron
  # de su envoltorio `?link=`, más 145 de archive.org por la misma vía— y que en el crawl completo
  # comparte las horas con otras tres webs, así que solo se le rasca por encima.
  #
  # `minutos` es el presupuesto de la parte cara: bajarse un trozo de cada fichero para comprobar
  # que reproduce.
  #
  # `limite` y `saltar_guardados` van JUNTOS, y existen por una medición incómoda: dos pasadas
  # `solo=fuegocine` seguidas fueron canceladas por GitHub a los 16 min y medio las dos (16m30s y
  # 16m36s), cinco minutos después de empezar a extraer. No es un tope de la plataforma —el crawl
  # completo ha corrido 3h44m— sino que esta pasada aprieta la red mucho más. Con un tope por
  # corrida que quepa en esa ventana, y saltando lo ya guardado, cada lanzamiento coge un tramo
  # nuevo y el archivo se recorre en varias vueltas en vez de repetir siempre el principio.
  workflow_dispatch:
    inputs:
      solo:
        description: 'Crawlear UNA sola web: fuegocine, peliculas, series o animes. Vacío = todas.'
        required: false
        default: ''
      minutos:
        description: 'Minutos para comprobar urls directas (por defecto 200).'
        required: false
        default: ''
      limite:
        description: 'Tope de títulos por corrida. Con `saltar_guardados`, cada lanzamiento coge un tramo nuevo.'
        required: false
        default: ''
      saltar_guardados:
        description: 'Saltar los títulos que ya están en la base, para avanzar en vez de repetir.'
        type: boolean
        required: false
        default: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest

    # ── EL TECHO PROPIO, PORQUE EL DE GITHUB NO PERDONA ────────────────────────────────────────
    #
    # Era el ÚNICO trabajo del repositorio sin `timeout-minutes`, y eso significa el tope duro de
    # la plataforma: seis horas y cancelación. No es un fallo teórico — la corrida del 2026-08-26
    # murió así a las 6h05m, y en una cancelación de plataforma NO se ejecutan los pasos con
    # `if: always()`. O sea que el crawl diario se llevaba por delante, todos los días, los cinco
    # pasos de mantenimiento que van detrás: retirar fuentes de otra película, rotar servidores,
    # limpiar los muertos, rellenar sinopsis y comprobar cruces.
    #
    # El comentario de más abajo decía «tarda 2h51m de las 6 h que tiene»; eso era verdad cuando se
    # escribió. El catálogo ha crecido y ya no cabe.
    #
    # Con 350 el trabajo termina por su cuenta diez minutos antes del tope de GitHub, así que lo
    # que decide qué pasa es nuestro presupuesto y no una guillotina externa.
    timeout-minutes: 350

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Crawl COMPLETO del catálogo (todas las categorías de tioplus paginadas hasta agotar +
      # todo FuegoCine) y lo persiste en Supabase. La API sirve búsqueda/listados desde la DB
      # (DB-first) en milisegundos, con recuperación total y scroll infinito.
      #
      # --streams=300 pre-resuelve además los enlaces de los títulos que alimentan el home,
      # para que su ficha emergente abra con los servidores ya listos (requiere la
      # migración 004; sin ella el paso se omite con un aviso).
      #
      # --verify=1500 resuelve a fondo las fichas que NUNCA se han resuelto y anota si tienen
      # enlaces reales (`has_streams`). Las que no los tienen dejan de anunciarse en el home y
      # en la búsqueda. Al ir por tandas, cada corrida avanza sobre lo que queda en vez de
      # repetir el catálogo entero (requiere la migración 005).
      #
      # SUBE DE 500 A 1.500 PORQUE HAY UN ATRASO QUE NADIE ESTABA TOCANDO. Este paso elegía sus
      # fichas por `has_streams IS NULL` —«sin veredicto»—, y el veredicto lo escribe otro
      # camino: `repairCatalog --sin-directo` condena a todo lo que no tiene vídeo directo, y una
      # ficha recién crawleada y sin resolver no lo tiene. Quedaban condenadas sin haberse
      # abierto, y ya no volvían a entrar aquí. Medido el 2026-08-19: 2.434 fichas así —el 16 %
      # del catálogo— y este paso alcanzaba a CUATRO. Ahora se eligen por «nunca resuelta»
      # (`streams_updated_at IS NULL`), que es un hecho y no una opinión.
      #
      # Sobre 25 de ellas, 8 recuperaron enlaces (32 %). A 1.500 por corrida el atraso se vacía
      # en dos vueltas y esto queda otra vez en mantenimiento. Cabe: el trabajo tarda 2h51m de
      # las 6 h que tiene por defecto.
      - name: Refrescar catálogo pre-scrapeado en Supabase
        # EL CRAWL SE CORTA A LAS CUATRO HORAS, Y LO DE DETRÁS SE EJECUTA IGUAL.
        #
        # Un `timeout-minutes` de PASO no es lo mismo que uno de trabajo: marca el paso como
        # fallido, pero el trabajo sigue vivo y los pasos con `if: always()` corren. Que es
        # exactamente lo que hacía falta — el crawl guarda por tandas mientras avanza, así que
        # cortarlo cuesta la cola de esta vuelta y nada más, mientras que perder el mantenimiento
        # cuesta un día entero de catálogo sin repasar.
        timeout-minutes: 240
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Necesaria para escribir en media_items (la tabla tiene RLS activado)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Los mandos de `workflow_dispatch` llegan por ENTORNO, no interpolados en la línea de
          # comandos: un valor que viniera con `;` dentro se ejecutaría en el runner. Y aun así se
          # validan abajo contra una lista cerrada, que es lo que de verdad cierra la puerta.
          SOLO: ${{ inputs.solo }}
          MINUTOS: ${{ inputs.minutos }}
          LIMITE: ${{ inputs.limite }}
          SALTAR: ${{ inputs.saltar_guardados }}
        run: |
          ARGS="--streams=300 --verify=1500"
          case "$SOLO" in
            fuegocine|archive|peliculas|series|animes) ARGS="$ARGS --solo=$SOLO" ;;
            "") ;;
            *) echo "::error::solo='$SOLO' no es una fuente conocida"; exit 1 ;;
          esac
          case "$MINUTOS" in
            '') ;;
            *[!0-9]*) echo "::error::minutos='$MINUTOS' no es un número"; exit 1 ;;
            *) ARGS="$ARGS --minutos=$MINUTOS" ;;
          esac
          if [ "$SALTAR" = "true" ]; then ARGS="$ARGS --saltar-guardados"; fi
          # El tope va SIN guion: es el argumento posicional del script, no una bandera.
          case "$LIMITE" in
            '') ;;
            *[!0-9]*) echo "::error::limite='$LIMITE' no es un número"; exit 1 ;;
            *) ARGS="$ARGS $LIMITE" ;;
          esac
          echo "refreshCatalog $ARGS"
          npx ts-node scripts/refreshCatalog.ts $ARGS

      # RED DE SEGURIDAD — que ninguna ficha sirva el vídeo de otra película.
      #
      # El catálogo está lleno de homónimos exactos ("Sin salida" son cuatro películas, "Carrie"
      # tres) y el título con el que se muestra una ficha es el de TMDB en español, el que más
      # colisiona. Cualquier emparejado que no compruebe el año acaba mezclando obras distintas,
      # y entonces la ficha entrega servidores que no le corresponden.
      #
      # La API y el crawl ya exigen prueba de identidad antes de fundir nada, así que esto no
      # debería encontrar trabajo. Se ejecuta igualmente todos los días porque el fallo es
      # silencioso —se ve al pulsar Reproducir, no en ningún error— y porque las fuentes cambian
      # sus páginas cuando quieren. Retira lo que se cuele y lo deja anotado en el log.
      - name: Retirar fuentes que pertenecen a otra película
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Sin estas credenciales la reparación se escribe en la base pero el caché sigue sirviendo
          # la ficha vieja hasta 6 h: con Redis compartido las claves sobreviven a los despliegues.
          # Si los secrets no existen, el script avisa y sigue (degrada a memoria local).
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --fuentes --apply

      # Y se comprueba que la invariante quedó limpia: si el paso anterior no pudo con algo, esto
      # FALLA y la corrida sale en rojo, que es la única forma de que no pase desapercibido.
      # Y que cada ficha tenga SU carátula y SU sinopsis.
      #
      # El tmdb_id de una fila no lo da la fuente: lo deduce el matcher a partir del título, y con
      # títulos que colisionan ("Atomica" 2017 son dos películas distintas, "El botín" 2026 otras
      # dos) puede acertar de menos y dejar la ficha con el póster, la sinopsis y el reparto de
      # otra. El crawl ya no adopta una ficha de TMDB sin respaldo independiente —año, título
      # original o el og:image de la página—, pero las fuentes reescriben sus páginas cuando
      # quieren, así que esto sigue repasando el catálogo contra el origen.
      #
      # --rotar elige la tanda por la FECHA en vez de por un punto de guardado (que en un runner
      # se pierde en cada corrida): así avanza sola y da la vuelta al catálogo entero cada ~21
      # días, en bucle y sin estado. Solo reescribe cuando la página de origen lo RESPALDA.
      - name: Repasar carátulas y sinopsis contra la página de origen
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --verify --apply --rotar --limit=700

      # Los ficheros de estos hosts se borran solos: caducan, los quita el que los subió, o cae una
      # reclamación de copyright. Sin esta pasada el catálogo acumula servidores que ya no existen y
      # el espectador se los encuentra uno por uno. La comprobación en vivo del reproductor no basta:
      # tiene 3 s de presupuesto y mira 6 servidores como mucho, así que un vídeo borrado en el
      # séptimo se sigue ofreciendo para siempre.
      #
      # --limit acota la corrida para que quepa en el runner; con ~19.000 embeds distintos y esta
      # tanda, el catálogo entero se repasa en unos días y vuelve a empezar. Solo retira lo que el
      # host DECLARA ausente (404/410/451, aviso de borrado, dominio aparcado, fichero envuelto que
      # ya no está): un timeout o un 429 nuestro no borran nada. Ver `motivoAutorizaBorrar`.
      - name: Retirar servidores cuyo vídeo ya no existe
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --servidores-muertos --apply --limit=6000

      # Una ficha puede haber adoptado su película de TMDB —póster, título, tmdb_id— y quedarse
      # con la frase de relleno de la fuente por sinopsis, porque TMDB la tiene vacía en español
      # y escrita en inglés. Parece completa y no lo está: son 174 fichas descubiertas de golpe a
      # partir de UN caso reportado. Esto va después del repaso porque ese repaso puede cambiarle
      # el tmdb_id a una ficha, y entonces su sinopsis hay que volver a traerla.
      - name: Rellenar sinopsis que TMDB sí tiene
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --sinopsis --apply

      # La extracción de vídeo directo y la limpieza de lo irreproducible viven en su propio
      # workflow (`reproducible.yml`), no aquí. Este ya tarda 111-151 min y la tarea tiene 360 de
      # techo; además esa cadena no debe depender de que el crawl termine ni heredar sus fallos.
      - name: Comprobar que cada ficha sirve su propio contenido
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node scripts/checkCatalog.ts --fallar-si-hay-cruces
