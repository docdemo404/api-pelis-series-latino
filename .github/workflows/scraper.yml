name: Catalog Refresh & Pre-scrape a Supabase

on:
  schedule:
    # Crawl COMPLETO del catálogo una vez al día (04:00 UTC). Es más pesado que el antiguo
    # refresh de home/últimos, así que se corre a diario en lugar de cada 6 h para no saturar
    # las fuentes; los listados (getAll) ya se auto-refrescan en vivo entre corridas.
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Crawl COMPLETO del catálogo (todas las categorías de tioplus paginadas hasta agotar +
      # todo FuegoCine) y lo persiste en Supabase. La API sirve búsqueda/listados desde la DB
      # (DB-first) en milisegundos, con recuperación total y scroll infinito.
      #
      # --streams=300 pre-resuelve además los enlaces de los títulos que alimentan el home,
      # para que su ficha emergente abra con los servidores ya listos (requiere la
      # migración 004; sin ella el paso se omite con un aviso).
      #
      # --verify=500 comprueba a fondo 500 fichas nunca verificadas y anota si tienen
      # enlaces reales (`has_streams`). Las que no los tienen dejan de anunciarse en el
      # home y en la búsqueda. Al ir por tandas, cada corrida diaria avanza sobre lo que
      # queda sin comprobar en vez de repetir el catálogo entero (requiere la migración 005).
      - name: Refrescar catálogo pre-scrapeado en Supabase
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Necesaria para escribir en media_items (la tabla tiene RLS activado)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node scripts/refreshCatalog.ts --streams=300 --verify=500

      # RED DE SEGURIDAD — que ninguna ficha sirva el vídeo de otra película.
      #
      # El catálogo está lleno de homónimos exactos ("Sin salida" son cuatro películas, "Carrie"
      # tres) y el título con el que se muestra una ficha es el de TMDB en español, el que más
      # colisiona. Cualquier emparejado que no compruebe el año acaba mezclando obras distintas,
      # y entonces la ficha entrega servidores que no le corresponden.
      #
      # La API y el crawl ya exigen prueba de identidad antes de fundir nada, así que esto no
      # debería encontrar trabajo. Se ejecuta igualmente todos los días porque el fallo es
      # silencioso —se ve al pulsar Reproducir, no en ningún error— y porque las fuentes cambian
      # sus páginas cuando quieren. Retira lo que se cuele y lo deja anotado en el log.
      - name: Retirar fuentes que pertenecen a otra película
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Sin estas credenciales la reparación se escribe en la base pero el caché sigue sirviendo
          # la ficha vieja hasta 6 h: con Redis compartido las claves sobreviven a los despliegues.
          # Si los secrets no existen, el script avisa y sigue (degrada a memoria local).
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --fuentes --apply

      # Y se comprueba que la invariante quedó limpia: si el paso anterior no pudo con algo, esto
      # FALLA y la corrida sale en rojo, que es la única forma de que no pase desapercibido.
      # Y que cada ficha tenga SU carátula y SU sinopsis.
      #
      # El tmdb_id de una fila no lo da la fuente: lo deduce el matcher a partir del título, y con
      # títulos que colisionan ("Atomica" 2017 son dos películas distintas, "El botín" 2026 otras
      # dos) puede acertar de menos y dejar la ficha con el póster, la sinopsis y el reparto de
      # otra. El crawl ya no adopta una ficha de TMDB sin respaldo independiente —año, título
      # original o el og:image de la página—, pero las fuentes reescriben sus páginas cuando
      # quieren, así que esto sigue repasando el catálogo contra el origen.
      #
      # --rotar elige la tanda por la FECHA en vez de por un punto de guardado (que en un runner
      # se pierde en cada corrida): así avanza sola y da la vuelta al catálogo entero cada ~21
      # días, en bucle y sin estado. Solo reescribe cuando la página de origen lo RESPALDA.
      - name: Repasar carátulas y sinopsis contra la página de origen
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --verify --apply --rotar --limit=700

      # Los ficheros de estos hosts se borran solos: caducan, los quita el que los subió, o cae una
      # reclamación de copyright. Sin esta pasada el catálogo acumula servidores que ya no existen y
      # el espectador se los encuentra uno por uno. La comprobación en vivo del reproductor no basta:
      # tiene 3 s de presupuesto y mira 6 servidores como mucho, así que un vídeo borrado en el
      # séptimo se sigue ofreciendo para siempre.
      #
      # --limit acota la corrida para que quepa en el runner; con ~19.000 embeds distintos y esta
      # tanda, el catálogo entero se repasa en unos días y vuelve a empezar. Solo retira lo que el
      # host DECLARA ausente (404/410/451, aviso de borrado, dominio aparcado, fichero envuelto que
      # ya no está): un timeout o un 429 nuestro no borran nada. Ver `motivoAutorizaBorrar`.
      - name: Retirar servidores cuyo vídeo ya no existe
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --servidores-muertos --apply --limit=6000

      # Una ficha puede haber adoptado su película de TMDB —póster, título, tmdb_id— y quedarse
      # con la frase de relleno de la fuente por sinopsis, porque TMDB la tiene vacía en español
      # y escrita en inglés. Parece completa y no lo está: son 174 fichas descubiertas de golpe a
      # partir de UN caso reportado. Esto va después del repaso porque ese repaso puede cambiarle
      # el tmdb_id a una ficha, y entonces su sinopsis hay que volver a traerla.
      - name: Rellenar sinopsis que TMDB sí tiene
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --sinopsis --apply

      # La extracción de vídeo directo y la limpieza de lo irreproducible viven en su propio
      # workflow (`reproducible.yml`), no aquí. Este ya tarda 111-151 min y la tarea tiene 360 de
      # techo; además esa cadena no debe depender de que el crawl termine ni heredar sus fallos.
      - name: Comprobar que cada ficha sirve su propio contenido
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node scripts/checkCatalog.ts --fallar-si-hay-cruces
