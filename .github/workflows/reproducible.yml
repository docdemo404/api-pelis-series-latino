name: Que todo lo que se anuncia se pueda reproducir

# POR QUÉ ESTO VA APARTE DEL CRAWL
#
# La API dejó de entregar iframes: la app cliente no sabe incrustarlos, así que un servidor sin
# `direct_stream` no llega al espectador. Eso convierte a la extracción en el trabajo que decide
# cuánto catálogo se puede ver — no en un extra del crawl.
#
# Y como extra del crawl iba mal por tres motivos:
#   1. El crawl tarda 111-151 min (medido) y la tarea tiene 360 de techo. La extracción de 900
#      fichas son otros ~100. Quedaba demasiado justo para algo que no puede fallar.
#   2. Si el crawl revienta a la mitad, la extracción no debería caer con él.
#   3. Se quiere MÁS a menudo que el crawl. Con 1.743 fichas de atraso, una vez al día tarda dos
#      días en ponerse al corriente; cada 8 h, unas horas.
#
# EL ORDEN NO ES NEGOCIABLE: extraer rescata fichas, comprobar deja mudas a las que mentían, y
# recuperar series devuelve las que sí se ven. Solo cuando los cuatro han terminado tiene sentido
# decidir qué se anuncia. Al revés, el último paso escondería justo lo que los anteriores arreglan.

on:
  schedule:
    # Cada 8 h, desfasado de las 04:00 UTC del crawl para no competir por las mismas fuentes.
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:
    inputs:
      fichas:
        description: 'Cuántas fichas extraer en esta corrida (900 es la tanda diaria; súbelo para vaciar un atraso de golpe)'
        required: false
        default: '900'

# Dos corridas a la vez se pisarían: escriben las mismas filas y se doblarían las peticiones a
# los hosts, que responden 429 mucho antes de lo que se cree. La nueva espera a que acabe la
# anterior en vez de cancelarla — a medio camino ya hay trabajo escrito que vale.
concurrency:
  group: reproducible
  cancel-in-progress: false

jobs:
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Comprobación de tipos ANTES de tocar nada. `npx ts-node` compila de verdad (sin
      # --transpile-only), así que un error de tipos no falla rápido: falla DESPUÉS de instalar,
      # en cada paso, y con el log lleno de otra cosa. Pasó: un `Cannot find name 'year'` en
      # repairCatalog.ts tumbó los cuatro pasos de reparación del crawl durante días, y no se vio
      # en local porque tsconfig.json no incluía ese fichero. Ahora los incluye, y esto lo cobra.
      - name: Comprobar que todo compila
        run: npx tsc --noEmit

      # 1. EXTRAER. Recorre el catálogo entero, ordena por antigüedad y se lleva las 900 más
      #    atrasadas, así que las tandas avanzan en vez de repetir la misma cabecera de lista.
      - name: Extraer el vídeo directo de los embed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/refreshCatalog.ts --direct-only --direct=${{ github.event.inputs.fichas || 900 }}

      # 2. Y de lo que dice tener vídeo directo, comprobar que su endpoint contesta. Un servidor
      #    rotulado "Vídeo directo" que da 502 es peor que un embed: el reproductor lo elige
      #    PRIMERO justo por estar mejor rotulado. Prueba dos veces antes de retirar nada, porque
      #    un 502 puede ser un 429 pasajero y degradar un servidor bueno es cambiar de problema.
      - name: Retirar los "vídeo directo" cuyo endpoint no responde
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --directos-falsos --apply --limit=2500

      # 3. LA COMPROBACIÓN DE VERDAD: bajar hasta el vídeo, no hasta la página del reproductor.
      #
      #    El paso anterior pregunta al endpoint si contesta. Este acuña el enlace, baja el
      #    manifiesto, revisa las variantes y se descarga un SEGMENTO REAL — la misma comprobación
      #    que hace el reproductor. Medido sobre 60 embeds publicados: 1 de cada 6 no entrega
      #    vídeo aunque su página cargue perfectamente. Y es el único paso que entra en
      #    `seasons[].episodes[].servers`, donde viven los enlaces de las series.
      #
      #    Deja `verified_at` en los que pasan, que es lo que hace que el `primary_stream` sea
      #    siempre algo probado. La ventana es rotatoria: cada corrida coge una tanda distinta y
      #    la vuelta completa llega sola.
      - name: Comprobar que lo publicado entrega vídeo de verdad
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --verificar --apply --limit=800

      # 4. DEVOLVER LAS SERIES QUE SÍ SE VEN. Una serie resuelve sus capítulos al abrirla, así que
      #    las que nadie abre nunca se quedan sin nada escrito y el paso 5 las esconde. Aquí se les
      #    abre un capítulo de verdad; desde que `getEpisode` persiste lo que resuelve, con eso
      #    basta para que vuelvan. Sin este paso el catálogo de series solo puede encoger.
      - name: Devolver al catálogo las series escondidas que reproducen
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --series-ocultas --apply --limit=300

      # 5. COMPROBAR CAPÍTULOS UNO A UNO. Un capítulo sin nada reproducible no debe anunciarse, y
      #    una temporada sin capítulos anunciables tampoco — pero eso solo se puede decidir sobre
      #    capítulos COMPROBADOS. Los enlaces de un episodio se resuelven al abrirlo, así que la
      #    mayoría están vacíos por no haberse pedido nunca, no por estar rotos: esconder por lista
      #    vacía dejaría casi todas las series sin un solo capítulo. Esto es lo que convierte «sin
      #    comprobar» en un veredicto, sellando `checked_at` con enlaces o sin ellos.
      #
      #    El grueso lo lleva `episodios.yml`, que tiene presupuesto propio y corre cada 4 h. Aquí
      #    va una tanda corta para que este trabajo no dependa de aquel.
      - name: Comprobar capítulos uno a uno
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --episodios --apply --limit=600

      # 6. Y recién ahora, qué se anuncia. Va en los DOS sentidos: esconde las fichas que se
      #    quedaron sin nada reproducible y devuelve las que han recuperado vídeo directo. Sin
      #    esa segunda mitad, cada corrida encogería el catálogo un poco más y lo que arreglan
      #    los extractores no volvería nunca.
      - name: Ajustar qué fichas se anuncian según lo que puedan reproducir
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --sin-directo --apply
