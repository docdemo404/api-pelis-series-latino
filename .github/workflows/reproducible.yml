name: Que todo lo que se anuncia se pueda reproducir

# POR QUÉ ESTO VA APARTE DEL CRAWL
#
# La API dejó de entregar iframes: la app cliente no sabe incrustarlos, así que un servidor sin
# `direct_stream` no llega al espectador. Eso convierte a la extracción en el trabajo que decide
# cuánto catálogo se puede ver — no en un extra del crawl.
#
# Y como extra del crawl iba mal por tres motivos:
#   1. El crawl tarda 111-151 min (medido) y la tarea tiene 360 de techo. La extracción de 900
#      fichas son otros ~100. Quedaba demasiado justo para algo que no puede fallar.
#   2. Si el crawl revienta a la mitad, la extracción no debería caer con él.
#   3. Se quiere MÁS a menudo que el crawl.
#
# EL ORDEN NO ES NEGOCIABLE: extraer rescata fichas, comprobar deja mudas a las que mentían, y
# recuperar series devuelve las que sí se ven. Solo cuando esos han terminado tiene sentido
# decidir qué se anuncia. Al revés, el último paso escondería justo lo que los anteriores arreglan.
#
# ── POR QUÉ SON SEIS TRABAJOS Y NO SEIS PASOS ────────────────────────────────────────────────
#
# Eran seis pasos de un mismo trabajo, y eso hacía que la muerte de UNO se llevara por delante a
# todos los siguientes. Medido el 2026-08-19: OCHO corridas seguidas sin un solo éxito. Las dos
# últimas murieron en el mismo sitio —`--directos-falsos`, a los 81 y a los 124 minutos— sin error
# y sin agotar el tope de 330: «The runner has received a shutdown signal». El paso iba bien
# (1600/2500 comprobados) y de pronto el runner desaparecía.
#
# No se ha podido averiguar POR QUÉ se apaga el runner; no queda rastro en los registros. Pero sí
# se puede hacer que deje de importar. Los `if: always()` que ya había no sirven de nada aquí: no
# es un paso que falla, es el trabajo entero que se evapora, y con él los cinco pasos restantes
# —incluido el que ajusta qué se anuncia—.
#
# Con un trabajo por tarea, cada uno corre en SU runner. Si uno se apaga, los demás siguen: el
# encadenado es `needs` + `if: always()`, que conserva el orden sin heredar la muerte. Cuesta unos
# 6 min de preparación repetida y a cambio el catálogo deja de depender de que ninguna de las seis
# tareas tenga un mal día.
#
# El coste real de aquello: 9.886 fichas con algo extraíble pendiente, porque el trabajo llevaba
# más de un día sin llegar al final.

on:
  schedule:
    # Cada 8 h, desfasado de las 04:00 UTC del crawl para no competir por las mismas fuentes.
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:
    inputs:
      fichas:
        description: 'Cuántas fichas extraer en esta corrida (2000 es la tanda normal; súbelo para vaciar un atraso de golpe)'
        required: false
        default: '2000'

# Dos corridas a la vez se pisarían: escriben las mismas filas y se doblarían las peticiones a
# los hosts, que responden 429 mucho antes de lo que se cree. La nueva espera a que acabe la
# anterior en vez de cancelarla — a medio camino ya hay trabajo escrito que vale.
concurrency:
  group: reproducible
  cancel-in-progress: false

jobs:
  # 1. EXTRAER. Recorre el catálogo, ordena por antigüedad y se lleva las más atrasadas, así que
  #    las tandas avanzan en vez de repetir la misma cabecera de lista.
  #
  #    LA TANDA SUBE DE 900 A 2.000, y el motivo es que el trabajo por fin RINDE. Con la familia
  #    upns apagada ocupando la cabeza de la cola, la extracción acertaba en 1 de cada 40 fichas
  #    medidas por el camino de producción: subir la tanda solo habría gastado más minutos en
  #    hosts que no podían salir bien. Descontados esos y devuelto vidhideplus (2026-08-19), el
  #    acierto es de 42 de 60 — el 70 % — y quedan ~10.000 fichas con algo extraíble pendiente.
  #
  #    Cabe en el tope: medido a 900 fichas en 57 min, 2.000 son unos 127 min más 6 de preparación,
  #    dentro de los 170 del trabajo. La concurrencia NO sube (sigue en 6): lo que crece es la
  #    duración, no las peticiones por segundo, que es lo que hace que estos hosts contesten 429.
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Comprobar que todo compila
        run: npx tsc --noEmit
      - name: Extraer el vídeo directo de los embed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/refreshCatalog.ts --direct-only --direct=${{ github.event.inputs.fichas || 2000 }}

  # 2. Y de lo que dice tener vídeo directo, comprobar que su endpoint contesta. Un servidor
  #    rotulado "Vídeo directo" que da 502 es peor que un embed: el reproductor lo elige PRIMERO
  #    justo por estar mejor rotulado. Prueba dos veces antes de retirar nada, porque un 502 puede
  #    ser un 429 pasajero y degradar un servidor bueno es cambiar de problema.
  falsos:
    needs: extraer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Retirar los "vídeo directo" cuyo endpoint no responde
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --directos-falsos --apply --limit=2500

  # 3. Una pasada corta de comprobación. El grueso lo lleva `verificar.yml`, que repasa el conjunto
  #    ENTERO cada 2 h — que es lo que hace que ningún sello caduque.
  #
  #    El trabajo anterior pregunta al endpoint si contesta. Este acuña el enlace, baja el
  #    manifiesto, revisa las variantes y se descarga un SEGMENTO REAL — la misma comprobación que
  #    hace el reproductor. Medido sobre 60 embeds publicados: 1 de cada 6 no entrega vídeo aunque
  #    su página cargue perfectamente. Y es el único paso que entra en `seasons[].episodes[]
  #    .servers`, donde viven los enlaces de las series.
  verificar:
    needs: falsos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Comprobar que lo publicado entrega vídeo de verdad
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --verificar --apply --limit=400

  # 4. DEVOLVER LAS SERIES QUE SÍ SE VEN. Una serie resuelve sus capítulos al abrirla, así que las
  #    que nadie abre nunca se quedan sin nada escrito y el último trabajo las esconde. Aquí se les
  #    abre un capítulo de verdad; desde que `getEpisode` persiste lo que resuelve, con eso basta
  #    para que vuelvan. Sin esto el catálogo de series solo puede encoger.
  series:
    needs: verificar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Devolver al catálogo las series escondidas que reproducen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --series-ocultas --apply --limit=300

  # 5. COMPROBAR CAPÍTULOS UNO A UNO. Un capítulo sin nada reproducible no debe anunciarse, y una
  #    temporada sin capítulos anunciables tampoco — pero eso solo se puede decidir sobre capítulos
  #    COMPROBADOS. Los enlaces de un episodio se resuelven al abrirlo, así que la mayoría están
  #    vacíos por no haberse pedido nunca, no por estar rotos: esconder por lista vacía dejaría casi
  #    todas las series sin un solo capítulo. Esto convierte «sin comprobar» en un veredicto.
  #
  #    El grueso lo lleva `episodios.yml`, con presupuesto propio cada 4 h. Aquí va una tanda corta.
  episodios:
    needs: series
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Comprobar capítulos uno a uno
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --episodios --apply --limit=600

  # 6. Y recién ahora, qué se anuncia. Va en los DOS sentidos: esconde las fichas que se quedaron
  #    sin nada reproducible y devuelve las que han recuperado vídeo directo. Sin esa segunda
  #    mitad, cada corrida encogería el catálogo un poco más y lo que arreglan los extractores no
  #    volvería nunca.
  #
  #    Es el trabajo que más veces se quedó sin ejecutar, y el único cuyo resultado ve el
  #    espectador. Por eso es el último y por eso va con `if: always()`.
  anunciar:
    needs: episodios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Ajustar qué fichas se anuncian según lo que puedan reproducir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npx ts-node scripts/repairCatalog.ts --sin-directo --apply
