name: Preparar mantenimiento distribuido de NetMirror

# Solo enumera candidatos de TMDB y los deja en Turso. No toca NewTV, por lo que funciona desde
# GitHub aunque NetMirror bloquee datacenters. Las instalaciones Android voluntarias resuelven
# lotes pequenos y la API exige acuerdo entre redes distintas antes de publicar o retirar.

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: 'Paginas de TMDB por proveedor y region (maximo 500)'
        required: false
        default: '500'
      regiones:
        description: 'Regiones de TMDB separadas por comas'
        required: false
        default: 'IN,MX,AR,CL,CO,PE,BR,ES,US,CA,GB,AU,DE,FR,IT'
      proveedor:
        description: 'todos, nf, pv o hs'
        required: false
        default: 'todos'
  schedule:
    - cron: '20 2,14 * * *'

concurrency:
  group: netmirror-candidatos
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actualizar cola desde TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: >-
          npm run preparar:netmirror --
          --paginas=${{ inputs.paginas || 500 }}
          --regiones=${{ inputs.regiones || 'IN,MX,AR,CL,CO,PE,BR,ES,US,CA,GB,AU,DE,FR,IT' }}
          --proveedor=${{ inputs.proveedor || 'todos' }}
