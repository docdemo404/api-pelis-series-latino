name: Ampliar el catálogo de TioPlus

on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:

concurrency:
  group: tioplus-catalogo
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recorrer la categoría y guardar la siguiente tanda
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # Películas tiene más páginas; recibe dos de cada cuatro tandas.
          case $(( (${{ github.run_number }} - 1) % 4 )) in
            0|2) FUENTE=peliculas ;;
            1) FUENTE=series ;;
            3) FUENTE=animes ;;
          esac
          npx ts-node scripts/refreshCatalog.ts \
            --solo="$FUENTE" --saltar-guardados \
            --minutos=25 --completar-minutos=10 300
