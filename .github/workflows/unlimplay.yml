name: Traer fichas y servidores de UnlimPlay

# UnlimPlay se consulta por tmdb_id: cada corrida trae primero lo popular en TMDB que no tenemos y
# después sigue la vuelta por el catálogo existente añadiendo servidores (streamwish, filelions)
# con vídeo comprobado. Por dónde va la vuelta se guarda en la tabla `esquema`.

on:
  schedule:
    # Cuatro al día en huecos sin videoapi, netmirror, scraper ni episodios: dar respaldo a las
    # ~7.600 fichas que solo tienen VideoAPI a 300 por corrida lleva cerca de una semana.
    - cron: '45 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuántos títulos como mucho en esta corrida'
        required: false
        default: '300'
      minutos:
        description: 'Presupuesto de reloj'
        required: false
        default: '40'
      solo:
        description: 'peliculas o series. Vacío = las dos.'
        required: false
        default: ''
      dry:
        description: 'Solo medir, sin escribir'
        type: boolean
        required: false
        default: false

concurrency:
  group: unlimplay
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - name: Importar UnlimPlay
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # Dos páginas por tanda; 250 tandas recorren las 500 páginas de TMDB
          # para películas y series. Antes cada ejecución repetía las primeras 15.
          DESDE=$(( ( (${{ github.run_number }} - 1) % 250 ) * 2 + 1 ))
          npx ts-node scripts/importarUnlimplay.ts \
            --limite=${{ inputs.limite || 300 }} \
            --minutos=${{ inputs.minutos || 40 }} \
            --paginas=2 --desde="$DESDE" \
            ${{ inputs.solo && format('--solo={0}', inputs.solo) || '' }} \
            ${{ inputs.dry && '--dry' || '' }}
