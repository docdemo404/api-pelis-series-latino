name = "api-pelis-proxy"
main = "src/index.js"
compatibility_date = "2026-07-29"

# El secreto NO va aquí: se sube con `npx wrangler secret put PROXY_SIGNING_KEY`, que lo guarda
# cifrado en Cloudflare y no lo deja escrito en el repositorio.
#
# Sin observabilidad no hay forma de saber si el Worker está sirviendo o fallando, y este proyecto
# ya se ha llevado dos sustos por dar por bueno algo sin mirarlo desplegado.
[observability]
enabled = true

# ── DONDE SE EJECUTA ESTE WORKER ──────────────────────────────────────────────────────────
#
# De fabrica, un Worker corre en el centro de datos mas cercano A QUIEN PIDE. Para casi todo eso es
# lo correcto, y aqui es justo al reves: lo que este Worker hace es pedirle trozos a un origen
# lejano y lento — archive.org cobra entre 10 y 25 s hasta el primer byte, y `cacheDeTrozos.js` le
# lanza rafagas de SEIS subpeticiones para amortizar esa latencia una sola vez.
#
# Con la colocacion inteligente, Cloudflare mira cuanto tarda cada peticion y mueve la ejecucion
# cerca del ORIGEN. Su documentacion lo dice con estas palabras: beneficia a los Workers que hacen
# muchas subpeticiones a servicios distantes. Lo que se paga es un salto mas para el espectador
# —milisegundos— y lo que se ahorra son seis viajes transatlanticos por trozo frio.
#
# Esta disponible en TODOS los planes, incluido el gratuito.
#
# Dos avisos: tarda unos quince minutos en activarse y necesita trafico sostenido desde varios
# sitios para decidir, asi que no se juzga el mismo dia de desplegarlo. Y si algun dia estorba, se
# quita cambiando `mode` a "off" — no hay nada mas atado a esto.
[placement]
mode = "smart"

# EL BUCKET DE LA CACHÉ POR TROZOS.
#
# R2 y no la caché del borde por dos razones. La primera es el dinero: R2 NO cobra tráfico de
# salida, que es exactamente lo caro de servir vídeo. La segunda es que la caché del borde es por
# PoP y se desaloja sola, así que un trozo guardado para un espectador puede no estar para el
# siguiente; R2 es un sitio, y lo que se guarda ahí lo encuentran todos.
#
# Los 10 GB del plan gratuito no son "cinco películas": son TROZOS sueltos, y todo el mundo ve los
# mismos principios. Cuando se llene, lo que se pierde es velocidad y nunca contenido — el Worker
# siempre puede volver al origen.
#
# Antes de desplegar: npx wrangler r2 bucket create api-pelis-cache
[[r2_buckets]]
binding = "CACHE"
bucket_name = "api-pelis-cache"
